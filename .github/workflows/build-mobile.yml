name: Build APK & IPA

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: safety_remote_app

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/SafetyRemote-${{ github.ref_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: safety-remote-apk
          path: safety_remote_app/dist/SafetyRemote-*.apk
          if-no-files-found: error

  ios-ipa:
    name: iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Pack unsigned IPA
        run: |
          mkdir -p build/ios/ipa_payload/Payload dist
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa_payload/Payload/
          (
            cd build/ios/ipa_payload
            zip -qr "../SafetyRemote-${{ github.ref_name }}-unsigned.ipa" Payload
          )
          cp "build/ios/SafetyRemote-${{ github.ref_name }}-unsigned.ipa" dist/

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: safety-remote-ipa-unsigned
          path: safety_remote_app/dist/SafetyRemote-*-unsigned.ipa
          if-no-files-found: error

      - name: Decode signing material
        id: signing
        if: ${{ vars.ENABLE_IOS_SIGNING == 'true' }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROV_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISION_BASE64" | base64 --decode > "$PROV_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "${IOS_CERTIFICATE_PASSWORD:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$PROV_PATH" | plutil -extract UUID raw -)
          cp "$PROV_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed IPA
        if: steps.signing.outputs.ready == 'true'
        run: flutter build ipa --release

      - name: Upload signed IPA artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: safety-remote-ipa-signed
          path: safety_remote_app/build/ios/ipa/*.ipa
          if-no-files-found: warn

  github-release:
    name: GitHub Release
    needs: [android-apk, ios-ipa]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: safety-remote-apk
          path: release-assets

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: safety-remote-ipa-unsigned
          path: release-assets

      - name: Download signed IPA (optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: safety-remote-ipa-signed
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Safety Remote ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## Safety Remote ${{ github.ref_name }}

            ### Tải về
            - **Android:** `SafetyRemote-${{ github.ref_name }}.apk`
            - **iOS (unsigned):** `SafetyRemote-${{ github.ref_name }}-unsigned.ipa` (cần ký trước khi cài lên máy thật)

            ### Ghi chú
            - SoftAP portal: `http://192.168.4.1/`
            - MQTT từ xa: `wss://mqtt.duynguyen.io.vn/mqtt`
            - Module EG800K cần SIM 4G để gửi SMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
